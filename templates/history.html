{% extends "base.html" %}
{% load static %}
{% block title %}Prediction History{% endblock %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
  <h3 class="mb-0"><i class="bi bi-clock-history"></i> Prediction history</h3>
  <div class="d-flex gap-2">
    <button id="btnClearHistory" class="btn btn-sm btn-outline-danger">
      <i class="bi bi-trash"></i> Clear all
    </button>
  </div>
</div>

<div class="card shadow-sm mb-3">
  <div class="card-body">
    <div class="row g-2">
      <div class="col-md-4">
        <input type="text" id="filterSearch" class="form-control" placeholder="Search activity...">
      </div>
      <div class="col-md-3">
        <select id="filterSource" class="form-select">
          <option value="">All sources</option>
          <option value="camera">Camera</option>
          <option value="upload">Upload</option>
          <option value="api">API</option>
        </select>
      </div>
      <div class="col-md-2">
        <select id="filterPageSize" class="form-select">
          <option value="10">10 / page</option>
          <option value="25">25 / page</option>
          <option value="50">50 / page</option>
        </select>
      </div>
      <div class="col-md-3">
        <button id="btnApplyFilter" class="btn btn-primary w-100">
          <i class="bi bi-funnel"></i> Apply
        </button>
      </div>
    </div>
  </div>
</div>

<div class="card shadow-sm">
  <div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th>Thumb</th>
          <th>Activity</th>
          <th>Confidence</th>
          <th>Processing</th>
          <th>Source</th>
          <th>Date</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="historyBody">
        <tr><td colspan="7" class="text-center text-muted py-4">Loading…</td></tr>
      </tbody>
    </table>
  </div>
  <div class="card-footer d-flex justify-content-between align-items-center">
    <span class="text-muted small" id="historyInfo"></span>
    <nav>
      <ul class="pagination pagination-sm mb-0" id="historyPagination"></ul>
    </nav>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/history.js' %}"></script>
{% endblock %}
